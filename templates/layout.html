<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" rel="stylesheet">
        <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet">
        <link href='https://cdn.datatables.net/1.13.5/css/dataTables.bootstrap5.min.css' rel='stylesheet'>
        <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
        <link href="static/styles.css" rel="stylesheet">

        <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
        <script src='https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js'></script>
        <script src='https://cdn.datatables.net/responsive/2.1.0/js/dataTables.responsive.min.js'></script>
        <script src='https://cdn.datatables.net/1.13.5/js/dataTables.bootstrap5.min.js'></script>
        <script src="static/functions.js"></script>

        <link href="static/img/logo.jpg" rel="icon">

        <title>wiser.Py: {% block title %}{% endblock %}</title>

    </head>

    <body class="fade">

        <nav class="bg-light border navbar navbar-expand-md navbar-light">

            <div class="container-fluid">
                <a class="navbar-brand" href="{{ url_for('menu') }}" title="build: {{build}}"><span class="blue">wiser</span>.<span class="yellow">py</span></a>

                <!-- <button aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler" data-bs-target="#navbar" data-bs-toggle="collapse" type="button">
                    <span class="navbar-toggler-icon"></span>
                </button> -->

                <div class="collapse navbar-collapse" id="navbar">

                    {% if session["user_id"] is defined %}
                        <ul class="navbar-nav me-auto mt-2">
                            <li class="nav-item"><span class="navbar-label navbar-username">| {{session["username"]}}</span></li>
                        </ul>

                    {% endif %}

                    <ul class="navbar-nav ms-auto mt-2">
                        <li class="navbar-version" id="version-label"></li>
                    </ul>

                    {% if session["user_id"] is defined %}
                        <ul class="navbar-nav ms-auto mt-2">
                            <li class="nav-item"><a class="nav-link" href="{{ url_for('change_pwd') }}"><span class="navbar-label">alterar password</span></a></li>
                            <li class="nav-item"><a class="nav-link"><span class="navbar-label">  |  </span></a></li>
                            <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}"><span class="navbar-label">log out</span></a></li>
                        </ul>
                        
                    {% else %}
                        <ul class="navbar-nav ms-auto mt-2">
                            <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}"><span class="navbar-label">log in</span></a></li>
                        </ul>

                    {% endif %}

                </div>

            </div>

        </nav>

        <main class="container-fluid py-5 text-center container-item" id="unloaded">
            {% block main %}{% endblock %}
        </main>

        <footer class="mb-5 small text-center text-muted wiser-footer">
            <!-- copyright -->
            <div id='div_cr'>
                <a title='desenvolvido por...'
                   href='https://www.linkedin.com/in/brunomastavares/'
                   target = '_blank'>
                    2024
                </a>
            </div>

        </footer>

        <!-- modal a exibir em processamento -->
        <div class="modal fade" id="loading" role="dialog">
            <div class="modal-dialog">
                <div class="modal-content loading-content">
                    <div class="modal-body">
                        <p>A processar...</p>
                    </div>
                </div>
            </div>
        </div>

    </body>

</html>
