{% extends "layout.html" %}

{% block title %}
    menu
{% endblock %}

{% block main %}
    <div class="mb-3" id="main-menu">
        <div class="table-responsive">
            <table class="table  table-striped table-hover table-borderless menu-table">
                <tbody class="table-primary menu-table-body">
                    <tr class="menu-table-body">
                        <th>
                            <form action="/sys_menu" method="post">
                                <input type="hidden" id="show_data" name="show_data" value="full_report">
                                <button class="nav-link" type="submit">
                                    <img src="static/img/all_data.jpg" class="menu-button" alt="dados completos">
                                    <br><br>
                                    <label class="menu-label">dados completos</label>
                                </button>
                            </form>

                            {% if admin or sosusr %}
                                <hr>

                                <script type="text/javascript">
                                    set_admin_layout();
                                </script>

                                <a class="nav-link" href="{{ url_for('sentinel_f') }}">
                                    <img src="static/img/Sentinel_F.jpg" class="menu-button" alt="Sentinel_F">
                                    <br><br>
                                    <!-- <label class="menu-label">Sentinel_F</label> -->
                                </a>
                            {% endif %}
                        </th>

                        <th>
                            <a class="nav-link" href="{{ url_for('user_report') }}">
                                <img src="static/img/filter_user.jpg" class="menu-button" alt="histórico">
                                <br><br>
                                <label class="menu-label">consultar histórico</label>
                            </a>

                            {% if admin or toolsusr %}
                                <hr>

                                <script type="text/javascript">
                                    set_admin_layout();
                                </script>

                                <a class="nav-link" href="{{ url_for('tools') }}">
                                    <img src="static/img/tools.jpg" class="menu-button" alt="utilitários">
                                    <br><br>
                                    <label class="menu-label">utilitários</label>
                                </a>
                            {% endif %}
                        </th>

                        {% if admin or bioman %}
                            <th>
                                <a class="nav-link" href="{{ url_for('user_bio') }}">
                                    <img src="static/img/bio.jpg" class="menu-button" alt="fotografia">
                                    <br><br>
                                    <label class="menu-label">gerir fotografia</label>
                                </a>

                                {% if admin %}
                                    <hr>

                                    <script type="text/javascript">
                                        set_admin_layout();
                                    </script>

                                    <a class="nav-link" href="{{ url_for('manage_users') }}">
                                        <img src="static/img/mng_user.jpg" class="menu-button" alt="utilizadores">
                                        <br><br>
                                        <label class="menu-label">gerir utilizadores</label>
                                    </a>
                                {% endif %}
                            </th>
                        {% endif %}

                        {% if admin or statsman %}
                            <th>
                                <form action="/sys_menu" method="post">
                                    <input type="hidden" id="show_data" name="show_data" value="stats">
                                    <button class="nav-link" type="submit">
                                        <img src="static/img/stats.jpg" class="menu-button" alt="indicadores">
                                        <br><br>
                                        <label class="menu-label">indicadores</label>
                                    </button>
                                </form>
                            </th>
                        {% endif %}
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
